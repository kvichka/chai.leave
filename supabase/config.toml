# Local development configuration for the Supabase CLI.
# Production settings live in the Supabase dashboard, not here.

project_id = "chai-leave"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
# app_private is deliberately NOT exposed. The RLS helper functions must not be
# callable over HTTP.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false          # accounts are created by an administrator, never self-service
enable_anonymous_sign_ins = false

[auth.email]
# Both keys are needed, and enable_signup is the one that matters.
#
# The CLI maps auth.email.enable_signup onto GoTrue's EXTERNAL_EMAIL_ENABLED,
# which gates sign-IN as well as sign-up. Setting it false does not mean "no
# self-service registration"; it means the email provider is switched off
# entirely and every password sign-in returns "Email logins are disabled".
# That is what broke CI twice.
#
# Self-service registration is still blocked, by [auth] enable_signup = false
# above. That is the global GOTRUE_DISABLE_SIGNUP switch and it is the right
# place for the rule: accounts are created by an administrator through
# rpc_admin_create_employee, never by someone filling in a form.
enabled = true
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[auth.external.google]
# Unused. Google sign-in was dropped in favour of administrator-created
# accounts; kept at false so nothing enables it by accident.
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
