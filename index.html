    <meta name="color-scheme" content="light" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232b7f9a'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='system-ui' fill='white'>C</text></svg>" />
    <!--
      Trebuchet MS is the CHAI standard and is pre-installed on every Windows
      and Mac machine, so no webfont is loaded for Latin text - it renders
      identically for every colleague, offline included.

      Noto Sans Khmer is fetched only because Trebuchet MS has no Khmer glyphs
      and the Identity Guide does not specify a Khmer face.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">

    <script type="module" src="/src/main.tsx"></script>
  </body>
